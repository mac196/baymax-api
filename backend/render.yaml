services:
    - type: web
    name: baymax-auto-os
    env: python
    region: singapore
    plan: free
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
            - key: GROQ_API_KEY
        sync: false
            - key: PYTHON_VERSION
        value: 3.11.0