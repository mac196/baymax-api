<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baymax - Pulse Check</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
body{
  background: radial-gradient(circle at 50% 0%, #1e3a8a 0%, #0f172a 50%, #020617 100%);
  display:flex;justify-content:center;align-items:flex-start;
  min-height:100vh;padding:24px 20px;
  overflow-y:auto;
}
.card{
  background: rgba(15,23,42,0.88);
  backdrop-filter: blur(16px);
  width:100%;max-width:420px;border-radius:28px;padding:24px 24px 28px;
  box-shadow: 0 0 0 1px rgba(56,189,248,0.3), 0 0 30px rgba(56,189,248,0.4), 0 20px 60px rgba(0,0,0,0.5);
  text-align:center;
  border: 1.5px solid #38bdf8;
}
.logo-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px;}
.logo-circle{width:44px;height:44px;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 15px #38bdf8, 0 0 30px #38bdf8;font-size:22px;}
h1{font-size:22px;color:white;letter-spacing:0.5px;text-shadow:0 0 12px rgba(56,189,248,0.9);}
.sub{color:#7dd3fc;font-size:13px;margin-bottom:18px;}
#cameraWrap{
  width:82%;aspect-ratio:1;border-radius:50%;overflow:hidden;background:#000;
  position:relative;margin:0 auto 18px;
  border:3px solid #38bdf8;
  box-shadow: 0 0 0 5px rgba(56,189,248,0.12), 0 0 35px rgba(56,189,248,0.7), inset 0 0 25px rgba(0,0,0,0.9);
}
#video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(2,6,23,0.3);color:#e0f2fe;font-size:14px;font-weight:600;text-shadow:0 1px 3px black;}
.bpm{font-size:64px;font-weight:900;color:white;line-height:1;text-shadow:0 0 15px #38bdf8, 0 0 30px #38bdf8;}
.bpm-label{color:#38bdf8;font-size:13px;margin-bottom:18px;letter-spacing:2px;font-weight:800;}
.btn{width:100%;padding:16px;border:none;border-radius:14px;font-weight:800;cursor:pointer;font-size:15px;letter-spacing:0.5px;transition:0.2s;}
#startBtn{background:linear-gradient(90deg, #38bdf8, #ffffff);color:#0f172a;box-shadow:0 0 20px rgba(56,189,248,0.7);display:block;}
#startBtn:active{transform:scale(0.98)}
#saveBtn{background:rgba(56,189,248,0.12);color:#7dd3fc;margin-top:12px;display:none;border:1.5px solid #38bdf8;}
#status{margin-top:14px;font-size:13px;color:#7dd3fc;min-height:22px;background:rgba(56,189,248,0.08);padding:10px 12px;border-radius:10px;border-left:3px solid #38bdf8;text-align:left;}
canvas{display:none}
.baymax-tag{margin-top:16px;font-size:11px;color:#38bdf8;letter-spacing:2px;opacity:0.7;}
</style>
</head>
<body>
<div class="card">
<div class="logo-row"><div class="logo-circle">🤖</div><h1>BAYMAX</h1></div>
<p class="sub">Cover back camera + flash with fingertip</p>
<div id="cameraWrap"><video id="video" autoplay playsinline muted></video><div id="overlay">Tap START to begin</div></div>
<div class="bpm" id="bpmDisplay">--</div>
<div class="bpm-label">BPM</div>
<button class="btn" id="startBtn" onclick="startScan()">START SCAN</button>
<button class="btn" id="saveBtn" onclick="saveToBaymax()">SAVE TO BAYMAX BRAIN</button>
<div id="status"></div>
<div class="baymax-tag">BAYMAX HEALTH • NEON CORE v2.0</div>
<canvas id="canvas"></canvas>
</div>

<script>
let video = document.getElementById('video');
let canvas = document.getElementById('canvas');
let ctx = canvas.getContext('2d');
let bpmDisplay = document.getElementById('bpmDisplay');
let overlay = document.getElementById('overlay');
let statusEl = document.getElementById('status');
let startBtn = document.getElementById('startBtn');
let saveBtn = document.getElementById('saveBtn');
let scanning = false;
let values = [];
let lastBPM = null;
let stream = null;

async function startCamera(){
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment", width: 640, height: 480 }
    });
    video.srcObject = stream;
    const track = stream.getVideoTracks()[0];
    try{
      await track.applyConstraints({ advanced: [{ torch: true }] });
    }catch(e){}
    return true;
  }catch(e){
    statusEl.innerText = "Camera error: " + e.message;
    return false;
  }
}

async function startScan(){
  if(scanning) return;
  let ok = await startCamera();
  if(!ok) return;
  scanning = true;
  values = [];
  lastBPM = null;
  bpmDisplay.innerText = "--";
  overlay.innerText = "Keep finger steady... 15s";
  statusEl.innerText = "Reading... keep finger fully covered";
  startBtn.style.display = "none";
  saveBtn.style.display = "none";
  saveBtn.innerText = "SAVE TO BAYMAX BRAIN";
  saveBtn.style.background = "rgba(56,189,248,0.12)";
  saveBtn.style.color = "#7dd3fc";
  let startTime = Date.now();
  let interval = setInterval(()=>{
    if(!scanning){ clearInterval(interval); return; }
    if(Date.now() - startTime > 15000){
      clearInterval(interval);
      finishScan();
      return;
    }
    processFrame();
  }, 100);
}

function processFrame(){
  canvas.width = 50;
  canvas.height = 50;
  ctx.drawImage(video, 0, 0, 50, 50);
  let data = ctx.getImageData(0,0,50,50).data;
  let r=0,g=0,b=0;
  for(let i=0;i<data.length;i+=4){ r+=data[i]; g+=data[i+1]; b+=data[i+2]; }
  let count = data.length/4;
  r/=count; g/=count; b/=count;
  let brightness = (r+g+b)/3;
  if(brightness < 40 || brightness > 230){
    overlay.innerText = "Cover lens fully with finger!";
    return;
  }
  values.push(r);
  overlay.innerText = `Reading... ${values.length}`;
  if(values.length > 150){
    let bpm = calculateBPM();
    if(bpm) bpmDisplay.innerText = bpm;
  }
}

function calculateBPM(){
  if(values.length < 50) return null;
  let mean = values.reduce((a,b)=>a+b,0)/values.length;
  let filtered = values.map(v=>v-mean);
  let peaks = 0;
  for(let i=1;i<filtered.length-1;i++){
    if(filtered[i] > filtered[i-1] && filtered[i] > filtered[i+1] && filtered[i] > 2){
      peaks++;
      i+=5;
    }
  }
  let durationSec = values.length * 0.1;
  let bpm = Math.round((peaks / durationSec) * 60);
  if(bpm < 50 || bpm > 180) return null;
  return bpm;
}

function finishScan(){
  scanning = false;
  let bpm = calculateBPM();
  if(!bpm){
    overlay.innerText = "Too much movement, try again";
    statusEl.innerText = "Could not read, keep finger still";
    startBtn.style.display = "block";
    startBtn.innerText = "RETRY SCAN";
    return;
  }
  lastBPM = bpm;
  bpmDisplay.innerText = bpm;
  overlay.innerText = `${bpm} BPM`;
  statusEl.innerText = `Ready to save: ${bpm} BPM`;
  startBtn.style.display = "block";
  startBtn.innerText = "SCAN AGAIN";
  saveBtn.style.display = "block";
  if(stream){
    stream.getTracks().forEach(t=>t.stop());
  }
}

async function saveToBaymax(){
  if(!lastBPM) return;
  let btn = document.getElementById('saveBtn');
  btn.innerText = "Saving...";
  try{
    const res = await fetch('/api/pulse', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ bpm: lastBPM, user_id: 'baymax_user' })
    });
    if(!res.ok) throw new Error('server');
    const data = await res.json();
    statusEl.innerText = `✅ Saved to Baymax Brain: ${lastBPM} BPM`;
    btn.innerText = 'SAVED ✓';
    btn.style.background = '#38bdf8';
    btn.style.color = '#0f172a';
  }catch(e){
    localStorage.setItem('baymax_last_bpm', lastBPM);
    statusEl.innerText = `⚠️ Saved locally: ${lastBPM} BPM (backend offline)`;
    btn.innerText = 'SAVED LOCALLY';
  }
}
</script>
</body>
</html>
