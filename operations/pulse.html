<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baymax - Driver Wellness</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
body{background:radial-gradient(circle at 50% 0%, #1e3a8a 0%, #0f172a 50%, #020617 100%);display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:24px 20px;}
.top{width:480px;max-width:100%;display:flex;justify-content:space-between;margin-bottom:18px;}
.top a{opacity:0.6;border:1px solid rgba(255,255,255,0.1);padding:8px 18px;border-radius:20px;color:white;text-decoration:none;font-size:12px}
.card{background:rgba(15,23,42,0.88);backdrop-filter:blur(16px);width:100%;max-width:480px;border-radius:28px;padding:24px;border:1.5px solid rgba(56,189,248,0.5);box-shadow:0 0 30px rgba(56,189,248,0.25);}
.bpm{font-weight:900;color:white;text-align:center;text-shadow:0 0 15px #38bdf8;transition:0.3s}
</style>
</head>
<body>
<div class="top"><a href="../index.html">← Hub</a><span style="opacity:0.3;font-size:11px;color:white">WELLNESS • 心率+疲劳 • 非接触</span></div>

<div class="card">
<div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px;">
<div style="width:44px;height:44px;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center;">🤖</div><h1 style="color:white;font-size:22px;">BAYMAX WELLNESS</h1></div>
<p style="color:#7dd3fc;font-size:11px;text-align:center;margin-bottom:14px;">方向盘 + 红外舱内 — 非接触式心率 | 三伏天中暑/疲劳预警</p>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;">
<div style="background:rgba(0,0,0,0.5);border-radius:16px;padding:14px;border:1px solid rgba(56,189,248,0.3);text-align:center;">
<div style="font-size:9px;color:#7dd3fc;letter-spacing:1px;">STEERING HR • 方向盘</div>
<div id="bpmDisplay" class="bpm" style="font-size:42px;">--</div>
<div style="font-size:10px;color:#7dd3fc;">BPM • 心率</div>
<div id="bpmBar" style="margin-top:8px;height:4px;background:rgba(56,189,248,0.2);border-radius:4px;overflow:hidden;"><div id="bpmFill" style="height:100%;width:0%;background:#38bdf8;transition:0.5s;"></div></div>
</div>
<div style="background:rgba(0,0,0,0.5);border-radius:16px;padding:14px;border:1px solid rgba(255,255,255,0.06);">
<div style="font-size:9px;color:#7dd3fc;opacity:0.7;letter-spacing:1px;">STATUS • 状态</div>
<div id="wellness" style="font-size:13px;color:white;margin-top:8px;line-height:1.8;">
Stress: —<br>Fatigue: —<br>Temp: 33°C 车内
</div>
<div id="actionTag" style="margin-top:8px;font-size:10px;padding:4px 8px;background:rgba(56,189,248,0.15);border-radius:6px;color:#7dd3fc;display:inline-block;">待机</div>
</div>
</div>

<div id="cameraWrap" style="width:100%;aspect-ratio:1.6;border-radius:18px;overflow:hidden;background:#000;position:relative;border:1px solid rgba(56,189,248,0.4);">
<video id="video" autoplay playsinline muted style="width:100%;height:100%;object-fit:cover;display:none;"></video>
<div id="overlay" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle,#0f172a, #020617);color:#e0f2fe;font-size:13px;gap:8px;">
<div style="font-size:32px;">💓</div><span>点 START 启动舱内检测</span><span style="font-size:10px;opacity:0.5;">ECU + IR cam 融合</span>
</div>
</div>

<button id="startBtn" onclick="startScan()" style="width:100%;margin-top:14px;padding:14px;background:linear-gradient(90deg,#38bdf8,#fff);border:none;border-radius:14px;font-weight:800;cursor:pointer;color:#0f172a;">START WELLNESS SCAN</button>
<div id="status" style="margin-top:12px;font-size:12px;color:#7dd3fc;background:rgba(56,189,248,0.08);padding:10px 14px;border-radius:10px;border-left:3px solid #38bdf8;">待机 — 可接方向盘ECU数据 • 本地处理</div>
<div style="margin-top:10px;font-size:10px;color:#38bdf8;opacity:0.5;text-align:center;">车规: 无接触 • 隐私本地 • 广州中暑/疲劳联动空调座椅 • 粤语关怀</div>
</div>

<script type="module">
import { BaymaxAPI } from "../api.js";
let scanning=false;
let intv=null;

async function tryCamera(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});
    const v = document.getElementById('video');
    v.srcObject = stream;
    v.style.display='block';
    return true;
  }catch(e){
    return false;
  }
}

window.startScan = async ()=>{
  if(scanning) return; 
  scanning=true;
  const btn = document.getElementById('startBtn');
  const overlay = document.getElementById('overlay');
  const bpmEl = document.getElementById('bpmDisplay');
  const wellnessEl = document.getElementById('wellness');
  const statusEl = document.getElementById('status');
  const fill = document.getElementById('bpmFill');
  const tag = document.getElementById('actionTag');

  btn.innerText='检测中... 保持手握方向盘';
  overlay.innerHTML='<div style="font-size:28px;animation:pulse 1s infinite">💓</div><span>检测中... IR+方向盘</span>';
  statusEl.innerText='Reading from steering sensor + IR cam... 融合检测';
  tag.innerText='检测中';
  tag.style.background='rgba(251,146,60,0.2)';
  tag.style.color='#fb923c';

  const hasCam = await tryCamera();

  let fakeBpm=72;
  intv=setInterval(()=>{
    fakeBpm = 68 + Math.floor(Math.random()*14);
    bpmEl.innerText=fakeBpm;
    fill.style.width = Math.min(100, fakeBpm) + '%';
    fill.style.background = fakeBpm>90 ? '#ef4444' : fakeBpm>85 ? '#f59e0b' : '#38bdf8';
    const stress = fakeBpm>85 ? '高 — 建议深呼吸' : fakeBpm>78 ? '中' : '低';
    const fatigue = fakeBpm>90 ? '中 — 注意' : '低';
    wellnessEl.innerHTML=`Stress: ${stress}<br>Fatigue: ${fatigue}<br>Temp: 33°C 车内`;
  },600);

  setTimeout(async ()=>{
    clearInterval(intv); scanning=false;
    const finalBpm = 68 + Math.floor(Math.random()*10);
    bpmEl.innerText=finalBpm;
    overlay.innerHTML=`<div style="font-size:32px;">✅</div><span>${finalBpm} BPM — 正常</span><span style="font-size:10px;opacity:0.6;">${hasCam?'IR+方向盘':'方向盘ECU(无摄像头)'}模式</span>`;
    statusEl.innerText=`✓ ${finalBpm}bpm 正常，如>100或疲劳将自动: 空调降温至22°C + 粤语提醒 + 靠边建议 • 广州三伏天保护`;
    btn.innerText='SCAN AGAIN';
    tag.innerText='✓ 正常 — 已同步空调';
    tag.style.background='rgba(34,197,94,0.15)';
    tag.style.color='#22c55e';
    try{
      const r = await BaymaxAPI.chat(`Driver HR ${finalBpm} bpm, stress low, Guangzhou 33C hot weather advice in Cantonese`, "wellness");
      statusEl.innerText = '✓ '+(r.reply||r.response||r).toString().slice(0,120);
      try{ BaymaxAPI.speakCantonese(`心率${finalBpm}，正常，记得多饮水`);}catch{}
    }catch(e){}
  },5500);
}
</script>
<style>@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.2)}100%{transform:scale(1)}}</style>
</body>
</html>
