<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Baymax 心率 - REAL</title>
<style>body{font-family:sans-serif;text-align:center;padding:20px;background:#000;color:#fff} #bpm{font-size:80px;color:#0f0} #canvas{display:none}</style>
</head>
<body>
<h2>Baymax 真实心率检测</h2>
<p>手指完全盖住后置摄像头 + 闪光灯</p>
<div id="bpm">--</div>
<div id="status">准备就绪</div>
<button onclick="start()" style="padding:15px 30px;font-size:18px;background:#0f0;border:none;border-radius:10px;">开始检测</button>
<div id="sos" style="display:none;margin-top:20px;background:red;padding:15px;border-radius:10px;">
  <p>⚠️ 心率异常！<span id="alert-bpm"></span></p>
  <a id="sosLink" target="_blank" style="color:white;font-weight:bold;">一键求助家人(发定位)</a>
</div>
<video id="v" autoplay playsinline style="width:1px;height:1px"></video>
<canvas id="c"></canvas>
<script>
let hr=0, measuring=false, lastPeak=0, reds=[], bpms=[];
function speak(t){let u=new SpeechSynthesisUtterance(t);u.lang='zh-HK';speechSynthesis.speak(u);}
async function start(){
  document.getElementById('status').innerText='正在启动摄像头...';
  let stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
  let v=document.getElementById('v'); v.srcObject=stream; await v.play();
  // try torch
  try{let track=stream.getVideoTracks()[0];await track.applyConstraints({advanced:[{torch:true}]})}catch(e){}
  measuring=true; loop();
}
function loop(){
  if(!measuring) return;
  let v=document.getElementById('v'), c=document.getElementById('c'), ctx=c.getContext('2d');
  c.width=50;c.height=50; ctx.drawImage(v,0,0,50,50);
  let d=ctx.getImageData(0,0,50,50).data, r=0; for(let i=0;i<d.length;i+=4) r+=d[i]; r/=d.length/4;
  reds.push(r); if(reds.length>150) reds.shift();
  if(reds.length>60){
    let avg=reds.slice(-20).reduce((a,b)=>a+b)/20;
    if(r>avg+1.5 && Date.now()-lastPeak>350){
      if(lastPeak>0){
        let bpm=Math.round(60000/(Date.now()-lastPeak));
        if(bpm>45 && bpm<130){bpms.push(bpm); if(bpms.length>5) bpms.shift(); hr=Math.round(bpms.reduce((a,b)=>a+b)/bpms.length);
          document.getElementById('bpm').innerText=hr; document.getElementById('status').innerText=hr>100?'偏高 注意':hr<60?'偏低':'正常 '+hr+' bpm';
          if(hr>110||hr<50){ document.getElementById('alert-bpm').innerText=hr+' bpm'; triggerSOS(hr); }
        }
      } lastPeak=Date.now();
    }
  } requestAnimationFrame(loop);
}
function triggerSOS(bpm){
  navigator.geolocation.getCurrentPosition(pos=>{
    let msg=`【Baymax求助】心率异常${bpm}bpm 位置:https://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude} 时间:${new Date().toLocaleString()}`;
    document.getElementById('sosLink').href=`https://wa.me/?text=${encodeURIComponent(msg)}`;
    document.getElementById('sos').style.display='block'; speak(`心率${bpm}，异常，已准备求助`); navigator.vibrate&&navigator.vibrate([500,200,500]);
  });
}
</script>
</body>
</html>
