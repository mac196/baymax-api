<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Personal Intelligence - Baymax</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}body{background:radial-gradient(circle at top,#1a1a2e 0%,#0a0a0a 100%);color:white;display:flex;flex-direction:column;align-items:center;padding:30px 20px;min-height:100vh;}
.top{width:900px;max-width:95%;display:flex;justify-content:space-between;margin-bottom:25px;} .top a{opacity:0.6;border:1px solid rgba(255,255,255,0.1);padding:8px 18px;border-radius:20px;color:white;text-decoration:none;}
.card{width:900px;max-width:95%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:24px;padding:30px;}
#chat{height:350px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;margin:20px 0;padding:10px;}
.msg{padding:12px 16px;border-radius:16px;max-width:80%;font-size:14px;line-height:1.4;}
.user{align-self:flex-end;background:#22c55e;color:black;}
.bot{align-self:flex-start;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);}
.inputRow{display:flex;gap:10px;}
input{flex:1;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:14px 18px;color:white;outline:none;}
button{background:#22c55e;border:none;padding:12px 22px;border-radius:20px;font-weight:700;cursor:pointer;}</style></head><body>
<div class="top"><a href="../index.html">← Hub</a><span style="opacity:0.3;font-size:11px;">PERSONAL INTELLIGENCE / LIVE API</span></div>
<div style="text-align:center;margin-bottom:10px;"><h1 style="font-size:34px;">PERSONAL <span style="color:#22c55e;">INTEL</span></h1><p style="opacity:0.5;">Connected to live Baymax API</p></div>
<div class="card">
<div id="chat"><div class="msg bot">Hello, I am Baymax. How can I help you today?</div></div>
<div class="inputRow"><input id="msgInput" placeholder="Ask Baymax anything..."><button onclick="send()">Send</button></div>
<div id="status" style="font-size:11px;opacity:0.4;margin-top:10px;text-align:center;">API: baymax-api-bil6.onrender.com ✓ Live</div>
</div>
<script>
const API = "https://baymax-api-bil6.onrender.com/chat";
async function send(){
 const input = document.getElementById('msgInput');
 const text = input.value.trim();
 if(!text) return;
 addMsg(text,'user');
 input.value='';
 addMsg('Thinking...','bot');
 try{
  const res = await fetch(API,{
   method:'POST',
   headers:{'Content-Type':'application/json'},
   body: JSON.stringify({message: text})
  });
  const data = await res.json();
  document.getElementById('chat').lastChild.remove();
  addMsg(data.reply || data.response || JSON.stringify(data),'bot');
 } catch(e){
  document.getElementById('chat').lastChild.remove();
  addMsg('Error: '+e.message+' — check if backend is awake','bot');
 }
}
function addMsg(t,c){
 const d=document.createElement('div'); d.className='msg '+c; d.innerText=t;
 document.getElementById('chat').appendChild(d);
 document.getElementById('chat').scrollTop=99999;
}
document.getElementById('msgInput').addEventListener('keypress',e=>{if(e.key==='Enter')send()});
</script></body></html>
