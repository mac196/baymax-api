<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baymax - Personal Healthcare</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
  body{
    min-height:100vh; background:#0F172A;
    background-image:
      radial-gradient(circle at 0% 0%, rgba(59,130,246,0.85) 0%, rgba(59,130,246,0.35) 28%, transparent 60%),
      radial-gradient(circle at 100% 0%, rgba(249,115,22,0.85) 0%, rgba(249,115,22,0.35) 28%, transparent 60%),
      radial-gradient(circle at 0% 100%, rgba(249,115,22,0.7) 0%, rgba(249,115,22,0.25) 28%, transparent 60%),
      radial-gradient(circle at 100% 100%, rgba(59,130,246,0.75) 0%, rgba(59,130,246,0.3) 28%, transparent 60%);
    display:flex; flex-direction:column; align-items:center; padding:16px;
  }
 .neon-center{ position:fixed; top:50%; left:50%; width:900px; height:900px; transform:translate(-50%,-50%); background:radial-gradient(circle, rgba(59,130,246,0.18) 0%, rgba(249,115,22,0.12) 45%, transparent 70%); filter:blur(50px); pointer-events:none; z-index:0; animation:pulseBg 4s infinite alternate; }
  @keyframes pulseBg{0%{transform:translate(-50%,-50%) scale(1)}100%{transform:translate(-50%,-50%) scale(1.25)}}

 .hero{ position:relative; z-index:2; text-align:center; width:100%; max-width:620px; margin-top:10px; }
 .top-widgets{ display:flex; justify-content:space-between; gap:10px; margin-bottom:14px; }
 .pill{ background:rgba(255,255,255,0.13); backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,0.22); padding:9px 14px; border-radius:20px; font-size:11px; color:white; display:flex; gap:8px; align-items:center; box-shadow:0 0 25px rgba(59,130,246,0.35); animation:float 5s ease-in-out infinite; }
 .pill:nth-child(2){ animation-delay:1s; box-shadow:0 0 25px rgba(249,115,22,0.35); }
 .heart{ color:#FB923C; animation:beat 1.1s infinite; }
  @keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.3)}28%{transform:scale(1)}42%{transform:scale(1.3)}70%{transform:scale(1)}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

 .baymax-head{ width:135px; height:110px; background:white; margin:0 auto 12px; border-radius:50% / 58%; display:flex; align-items:center; justify-content:center; position:relative; box-shadow: 0 0 0 2px rgba(255,255,255,0.6), 0 0 50px rgba(59,130,246,0.95), 0 0 90px rgba(249,115,22,0.7), 0 20px 60px rgba(0,0,0,0.25); }
 .eyes{ display:flex; gap:44px; position:relative; }.eye{ width:13px; height:13px; background:#0F172A; border-radius:50%; box-shadow:0 0 8px rgba(59,130,246,0.8); }.eyes::before{ content:''; position:absolute; top:50%; left:50%; width:56px; height:2.5px; background:#0F172A; transform:translate(-50%,-50%); }
 .glow{ position:absolute; inset:-22px; border-radius:50%; background:radial-gradient(circle, rgba(59,130,246,0.35), transparent 70%); animation:glowPulse 2s infinite; z-index:-1; }
  @keyframes glowPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.3);opacity:0.6}}

 .title{ font-size:36px; font-weight:800; color:white; letter-spacing:-1px; text-shadow:0 0 30px rgba(59,130,246,0.9); }
 .subtitle{ font-size:12px; color:rgba(255,255,255,0.7); margin-top:4px; }

 .card{ position:relative; z-index:2; width:100%; max-width:620px; background:rgba(15,23,42,0.72); backdrop-filter:blur(28px); border:1px solid rgba(255,255,255,0.16); border-radius:26px; margin-top:18px; overflow:hidden; box-shadow:0 30px 90px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.1) inset, 0 0 60px rgba(59,130,246,0.2); }
  #chat{ height:420px; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:13px; }
 .msg{ max-width:86%; padding:13px 16px; border-radius:18px; font-size:14px; line-height:1.55; word-wrap:break-word; }
 .bot{ background:rgba(255,255,255,0.97); color:#0F172A; align-self:flex-start; border-bottom-left-radius:6px; box-shadow:0 6px 24px rgba(59,130,246,0.18); }
 .bot b{ color:#1D4ED8; }
 .user{ background:linear-gradient(135deg,#3B82F6,#F97316); color:white; align-self:flex-end; border-bottom-right-radius:6px; box-shadow:0 10px 28px rgba(59,130,246,0.4); }
 .inputRow{ display:flex; gap:8px; padding:14px; background:rgba(0,0,0,0.25); border-top:1px solid rgba(255,255,255,0.12); }
  #msgInput{ flex:1; border:1px solid rgba(255,255,255,0.18); background:rgba(255,255,255,0.12); color:white; padding:13px 16px; border-radius:12px; outline:none; font-size:14px; }
  #msgInput::placeholder{ color:rgba(255,255,255,0.5); } #msgInput:focus{ border-color:#3B82F6; background:rgba(255,255,255,0.18); box-shadow:0 0 0 3px rgba(59,130,246,0.25); }
  button{ background:linear-gradient(135deg,#3B82F6,#F97316); color:white; border:none; padding:0 24px; border-radius:12px; font-weight:700; cursor:pointer; box-shadow:0 0 22px rgba(59,130,246,0.55); }
  button:active{ transform:scale(0.97); }
  #status{ text-align:center; font-size:10px; color:rgba(255,255,255,0.5); padding:8px; letter-spacing:0.6px; }
 .tip-card{ background:rgba(59,130,246,0.08); border:1px solid rgba(59,130,246,0.18); padding:10px 12px; border-radius:12px; margin-top:8px; }
</style>
</head>
<body>
<div class="neon-center"></div>

<div class="hero">
  <div class="top-widgets">
    <div class="pill"><span>🧬</span> DNA • ACTIVE <span style="width:8px;height:8px;background:#22C55E;border-radius:50%;display:inline-block;box-shadow:0 0 8px #22C55E"></span></div>
    <div class="pill"><span class="heart">❤️</span> 72 BPM <svg width="40" height="16" viewBox="0 0 40 16"><path d="M0 8 L8 8 L11 1 L15 15 L19 3 L23 8 L40 8" fill="none" stroke="#FB923C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  </div>
  <div class="baymax-head"><div class="glow"></div><div class="eyes"><div class="eye"></div><div class="eye"></div></div></div>
  <div class="title">BAYMAX</div>
  <div class="subtitle">Personal Healthcare • Blue & Orange Neon</div>
</div>

<div class="card">
  <div id="chat"><div class="msg bot">Hi there! I'm Baymax 👋 Your friendly healthcare companion. I'm here to help you feel a bit better. How are you feeling today?</div></div>
  <div class="inputRow"><input id="msgInput" type="text" placeholder="Type your message..." autocomplete="off"><button id="sendBtn">Send</button></div>
  <div id="status">BLUE • ORANGE • API: baymax-api-bii6.onrender.com</div>
</div>

<script>
const API = "https://baymax-api-bii6.onrender.com/chat";
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('msgInput');
const btnEl = document.getElementById('sendBtn');

function formatBotText(text){
  let t = text || "";
  // Remove markdown junk like ### --- and table separators
  t = t.replace(/###/g,'').replace(/---+/g,'').replace(/\|\s*---.*?\n/g,'\n').replace(/\|---+/g,'');
  // Convert **bold**
  t = t.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');

  // If it contains | pipes - it's that ugly table - make it cards
  if(t.includes('|') && t.includes('**')){
    let parts = t.split('\n').filter(l=>l.includes('**') && l.includes('|'));
    if(parts.length===0) parts = t.split('||').filter(p=>p.trim().length>5);
    if(parts.length>0){
      let intro = t.split('|')[0].split('\n')[0].replace(/\*\*/g,'').trim();
      if(intro.length<10) intro = "Here are some gentle things you can try:";
      let html = `<div>${intro}</div><div style="margin-top:12px;display:flex;flex-direction:column;gap:9px;">`;
      parts.forEach(p=>{
        let titleMatch = p.match(/\*\*(.*?)\*\*/) || p.match(/<b>(.*?)<\/b>/);
        let title = titleMatch? titleMatch[1] : 'Tip';
        let rest = p.replace(/\*\*/g,'').replace(/<b>/g,'').replace(/<\/b>/g,'').split('|');
        let desc = rest.slice(1,3).join(' • ').trim().substring(0,200);
        if(title && desc.length>2){
          html += `<div class="tip-card"><b>• ${title.trim()}</b><br><span style="font-size:13px;color:#334155;">${desc}</span></div>`;
        }
      });
      html += '</div>';
      // Add outro if exists
      let outro = t.split('Remember').pop();
      if(outro && outro.length>20 && outro.length<200) html += `<div style="margin-top:12px;font-size:13px;opacity:0.9;">${outro.replace(/\*\*/g,'')}</div>`;
      return html;
    }
  }
  return t.replace(/\n/g,'<br>').trim();
}

function addMsg(t,c){
  const d=document.createElement('div'); d.className='msg '+c;
  if(c==='bot'){ d.innerHTML = formatBotText(t); }
  else { d.textContent=t; }
  chatEl.appendChild(d); chatEl.scrollTop=chatEl.scrollHeight;
}

async function send(){
  const text=inputEl.value.trim(); if(!text) return;
  addMsg(text,'user'); inputEl.value='';
  const th=document.createElement('div'); th.className='msg bot'; th.textContent='Baymax is thinking...'; th.id='th'; chatEl.appendChild(th); chatEl.scrollTop=chatEl.scrollHeight;
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});
    const data=await r.json();
    document.getElementById('th')?.remove();
    addMsg(data.reply || data.response || 'I am here to help you.','bot');
  }catch(e){
    document.getElementById('th')?.remove();
    addMsg('Backend is waking up (Render free tier sleeps). Please wait 20 seconds and try again.','bot');
  }
}
btnEl.addEventListener('click', send);
inputEl.addEventListener('keydown', (e)=>{ if(e.key==='Enter') send(); });
inputEl.focus();
</script>
</body>
</html>
