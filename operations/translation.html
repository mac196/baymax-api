<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Translation Operation - Baymax</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI', sans-serif;}
body{background:radial-gradient(circle at top, #1a1a2e 0%, #0a0a0a 100%);color:white;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 20px;}
.top-nav{width:800px;max-width:95%;display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;}
.top-nav a{color:white;text-decoration:none;opacity:0.6;transition:0.3s;border:1px solid rgba(255,255,255,0.1);padding:8px 18px;border-radius:20px;}
.top-nav a:hover{opacity:1;border-color:#00f2ff;color:#00f2ff;}
.header{text-align:center;margin-bottom:35px;}
.header .badge{display:inline-block;background:rgba(0,242,255,0.15);border:1px solid #00f2ff;color:#00f2ff;padding:5px 14px;border-radius:20px;font-size:11px;letter-spacing:1px;margin-bottom:15px;}
.header h1{font-size:38px;letter-spacing:2px;}
.header h1 span{color:#00f2ff;text-shadow:0 0 15px #00f2ff;}
.header p{opacity:0.5;margin-top:8px;}
.main-card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:24px;padding:35px;width:800px;max-width:95%;backdrop-filter:blur(12px);}
.lang-row{display:flex;gap:15px;margin-bottom:25px;align-items:center;justify-content:center;}
.lang-select{background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.15);border-radius:12px;padding:12px 20px;color:white;width:100%;font-size:15px;outline:none;}
.swap{width:45px;height:45px;background:rgba(0,242,255,0.1);border:1px solid #00f2ff;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:0.3s;}
.swap:hover{background:#00f2ff;color:black;transform:rotate(180deg);}
.text-boxes{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:30px;}
.text-area{background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:20px;min-height:180px;}
.text-area label{font-size:11px;opacity:0.4;letter-spacing:1.5px;margin-bottom:12px;display:block;}
.text-area textarea{width:100%;background:transparent;border:none;color:white;font-size:16px;resize:none;outline:none;min-height:120px;}
.text-area.translated{border-color:rgba(0,242,255,0.3);background:rgba(0,242,255,0.05);}
.controls{display:flex;gap:15px;justify-content:center;flex-wrap:wrap;}
.btn{padding:14px 30px;border-radius:30px;border:none;font-size:15px;font-weight:600;cursor:pointer;transition:0.3s;}
.btn-mic{background:white;color:black;}
.btn-translate{background:#00f2ff;color:black;box-shadow:0 0 30px rgba(0,242,255,0.4);}
.btn-secondary{background:rgba(255,255,255,0.08);color:white;border:1px solid rgba(255,255,255,0.1);}
.status{text-align:center;margin-top:20px;font-size:13px;opacity:0.4;}
.status .dot{display:inline-block;width:8px;height:8px;background:#00ff88;border-radius:50%;margin-right:6px;}
</style>
</head>
<body>
<div class="top-nav">
<a href="../index.html">← Back to Hub</a>
<span style="opacity:0.3;font-size:12px;">TRANSLATION OP / FRONTEND</span>
</div>
<div class="header">
<div class="badge">OPERATION ACTIVE</div>
<h1>TRANSLATION <span>MODE</span></h1>
<p>Real-time voice & text — Frontend Design</p>
</div>
<div class="main-card">
<div class="lang-row">
<select class="lang-select"><option>🇬🇧 English - Source</option><option>🇫🇷 French</option><option>🇪🇸 Spanish</option><option>🇷🇼 Kinyarwanda</option><option>🇯🇵 Japanese</option></select>
<div class="swap">⇄</div>
<select class="lang-select"><option>🇫🇷 French - Target</option><option>🇬🇧 English</option><option>🇪🇸 Spanish</option><option>🇷🇼 Kinyarwanda</option></select>
</div>
<div class="text-boxes">
<div class="text-area"><label>SPEAK OR TYPE</label><textarea>Hello, how are you today?</textarea></div>
<div class="text-area translated"><label>BAYMAX TRANSLATION</label><textarea readonly>Bonjour, comment allez-vous aujourd'hui ?</textarea></div>
</div>
<div class="controls">
<button class="btn btn-mic">🎤 Hold to Speak</button>
<button class="btn btn-translate">🌐 Translate</button>
<button class="btn btn-secondary">🔊 Play</button>
<button class="btn btn-secondary">📋 Copy</button>
</div>
<div class="status"><span class="dot"></span> Frontend Only — Backend will be wired later</div>
</div>
</body>
</html>
