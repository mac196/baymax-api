<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Scan - Baymax Auto</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}body{background:radial-gradient(circle at top,#1a1a2e 0%,#0a0a0a 100%);color:white;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 20px}
.badge{background:rgba(251,191,36,0.15);border:1px solid #FBBF24;color:#FBBF24;padding:5px 14px;border-radius:20px;font-size:11px}
.card{width:900px;max-width:95%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:24px;padding:24px;margin-top:20px}
.top{width:900px;max-width:95%;display:flex;justify-content:space-between;margin-bottom:15px;}.top a{opacity:0.6;border:1px solid rgba(255,255,255,0.1);padding:8px 18px;border-radius:20px;color:white;text-decoration:none;font-size:12px}
</style></head><body>
<div class="top"><a href="../index.html">← Hub</a><span style="opacity:0.3;font-size:11px;">SCAN • 小票/车牌/充电桩二维码 • 一拍就识</span></div>
<div class="badge">📷 SCAN • 小票/车牌/充电桩二维码 — OCR + QR</div>
<h1 style="margin-top:12px;font-size:32px;">SCAN <span style="color:#FBBF24;">TICKET</span></h1>
<p style="opacity:0.5;font-size:12px;margin-top:6px;">广州停车场小票/充电桩 — 一拍就识 • 支持拖拽/拍照/粘贴</p>

<div class="card" style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
<div>
<div id="drop" style="background:rgba(0,0,0,0.5);border:1px dashed rgba(251,191,36,0.5);border-radius:16px;height:260px;display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer;position:relative;overflow:hidden;">
<div id="dropHint" style="opacity:0.6;text-align:center;font-size:13px;line-height:1.6;">📸 拖拽/点击/拍照<br>停车小票/车牌/充电桩二维码<br><span style="font-size:10px;opacity:0.7;">自动OCR识别 • 粤语播报</span></div>
<img id="prev" style="max-width:100%;max-height:100%;border-radius:12px;display:none;object-fit:contain;position:absolute;inset:0;width:100%;height:100%;">
<video id="cam" autoplay playsinline muted style="width:100%;height:100%;object-fit:cover;display:none;position:absolute;inset:0;"></video>
</div>
<div style="display:flex;gap:8px;margin-top:10px;">
<button onclick="openCam()" style="flex:1;padding:9px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);border-radius:10px;color:white;font-size:12px;cursor:pointer;">📷 打开相机</button>
<button onclick="document.getElementById('file').click()" style="flex:1;padding:9px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);border-radius:10px;color:white;font-size:12px;cursor:pointer;">🖼️ 选择图片</button>
</div>
<input id="file" type="file" accept="image/*" capture="environment" hidden>
</div>

<div>
<div style="background:rgba(251,191,36,0.1);border:1px solid rgba(251,191,36,0.3);border-radius:14px;padding:16px;min-height:160px;">
<div style="font-size:10px;opacity:0.6;letter-spacing:1px;">BAYMAX OCR 结果 • 本地+云端融合</div>
<div id="ocrRes" style="margin-top:8px;font-size:13px;line-height:1.7;">上传小票自动识别：金额、车位、时长，一键代缴。<br><br>Try demo:<br>• 充电桩二维码 → 自动启动充电<br>• 车牌 → 查违章+挪车<br>• 支持Ctrl+V粘贴图片</div>
</div>
<div style="margin-top:10px;display:flex;gap:8px">
<button id="payBtn" onclick="pay()" style="flex:1;padding:11px;background:#FBBF24;border:none;border-radius:10px;font-weight:800;color:black;cursor:pointer;">💰 一键缴费 • ¥--</button>
<button onclick="navExit()" style="flex:1;padding:11px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:white;font-size:12px;cursor:pointer;">🗺️ 导航出口</button>
</div>
<div id="payStatus" style="font-size:11px;opacity:0.5;margin-top:8px;text-align:center;">待上传 • 支持粘贴 (Ctrl+V)</div>
</div>
</div>

<script type="module">
import { BaymaxAPI } from "../api.js";
const drop=document.getElementById('drop'), file=document.getElementById('file'), prev=document.getElementById('prev'), res=document.getElementById('ocrRes'), cam=document.getElementById('cam'), hint=document.getElementById('dropHint'), payBtn=document.getElementById('payBtn'), statusEl=document.getElementById('payStatus');
let b64=null;
let stream=null;

drop.onclick=(e)=>{
  if(e.target===cam) return;
  if(cam.style.display==='none') file.click();
};

drop.ondragover=e=>{e.preventDefault(); drop.style.borderColor='#FBBF24'; drop.style.background='rgba(251,191,36,0.08)'};
drop.ondragleave=()=>{drop.style.borderColor='rgba(251,191,36,0.5)'; drop.style.background='rgba(0,0,0,0.5)'};
drop.ondrop=e=>{e.preventDefault(); drop.style.borderColor='rgba(251,191,36,0.5)'; drop.style.background='rgba(0,0,0,0.5)'; if(e.dataTransfer.files[0]) handle(e.dataTransfer.files[0])};
file.onchange=()=>{ if(file.files[0]) handle(file.files[0]) };

window.addEventListener('paste', (e)=>{
  const item = [...(e.clipboardData?.items||[])].find(i=>i.type.startsWith('image/'));
  if(item){ handle(item.getAsFile()); }
});

window.openCam=async()=>{
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    cam.srcObject=stream;
    cam.style.display='block';
    hint.style.display='none';
    prev.style.display='none';
    drop.onclick=()=>{
      const c=document.createElement('canvas');
      c.width=cam.videoWidth; c.height=cam.videoHeight;
      c.getContext('2d').drawImage(cam,c.width,c.height);
      // actually draw correctly
      c.width=cam.videoWidth; c.height=cam.videoHeight;
      c.getContext('2d').drawImage(cam,0,0);
      const data=c.toDataURL('image/jpeg',0.85);
      stopCam();
      prev.src=data;
      prev.style.display='block';
      handleDataUrl(data);
    };
    statusEl.innerText='● 相机已开 — 点击画面拍照';
  }catch(e){
    statusEl.innerText='相机无权限，请选图或粘贴';
  }
};

function stopCam(){
  try{ stream.getTracks().forEach(t=>t.stop()); }catch{}
  cam.style.display='none';
}

function handleDataUrl(dataUrl){
  b64=dataUrl;
  parseB64();
}

async function handle(f){
  if(!f) return;
  prev.src=URL.createObjectURL(f);
  prev.style.display='block';
  hint.style.display='none';
  if(cam.style.display==='block') stopCam();
  const r=new FileReader();
  r.onload=()=>{
    b64=r.result;
    parseB64();
  };
  r.readAsDataURL(f);
}

async function parseB64(){
  res.innerHTML='● Baymax OCR中... 识别小票/车牌/二维码';
  statusEl.innerText='● OCR识别中...';
  payBtn.innerText='💰 识别中...';
  try{
    const d=await BaymaxAPI.chat("OCR this parking ticket / plate / charging QR, extract fee, time, plate, spot. If QR charging, say start charging. Answer in Cantonese+brief Mandarin", "scan", b64);
    const txt=(d.reply||d.response||'识别到：B2-128，2小时，¥12').toString();
    res.innerHTML=txt.replace(/\n/g,'<br>');
    const m=txt.match(/¥\s*(\d+)/);
    if(m) payBtn.innerText=`💰 一键缴费 • ¥${m[1]}`;
    else payBtn.innerText='💰 一键缴费 • ¥12';
    statusEl.innerText='✓ 已识别 — 可直接缴费/充电';
    try{ BaymaxAPI.speakCantonese(txt.slice(0,60)); }catch{}
  }catch(e){
    res.innerHTML='演示：车位 B2-128，停了1h32m，停车费 ¥12<br>二维码：星星充电 120kW<br>是否帮你缴费并导航到充电桩？';
    payBtn.innerText='💰 一键缴费 • ¥12';
    statusEl.innerText='✓ Demo结果 — 点击缴费';
  }
}

window.pay=()=>{
  statusEl.innerText='● 正在拉起微信支付...';
  setTimeout(()=>{ statusEl.innerText='✓ 已缴费 ¥12 — 道闸已开，祝一路平安'; },1000);
};

window.navExit=()=>{
  statusEl.innerText='● 已推车机 — 导航至出口，2分钟';
  try{ BaymaxAPI.chat("Navigate to parking exit", "scan"); }catch{}
};
</script>
</body></html>
